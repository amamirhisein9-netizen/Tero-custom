<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TERO CUSTOM</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  background: #151722;
  color: white;
  font-family: sans-serif;
  text-align: center;
}
h1 { color: #f4c542; }
p { color: #c6c9d4; }
button {
  display: block;
  width: 100%;
  padding: 18px;
  margin: 12px 0;
  border: 0;
  border-radius: 14px;
  color: white;
  font-size: 17px;
  font-weight: bold;
}
.red { background: #bd3944; }
.blue { background: #267fc0; }
.green { background: #32834b; }
.purple { background: #8146a8; }
</style>
</head>
<body>
<h1>🔥 TERO CUSTOM</h1>
<p>پنل کاستوم کالاف دیوتی موبایل</p>

<button class="red" onclick="alert('برای ثبت کاستوم، از ربات تلگرام استفاده کن.')">🎮 ثبت کاستوم جدید</button>
<button class="blue" onclick="alert('اتصال به ربات در مرحله بعد انجام می‌شود.')">📢 ارسال کاستوم به کانال</button>
<button class="green" onclick="alert('هنوز کاستومی ثبت نشده است.')">📋 مشاهده اطلاعات کاستوم</button>
<button class="purple" onclick="alert('برای شروع دوباره از ربات استفاده کن.')">🔄 کاستوم جدید</button>
</body>
</html>
